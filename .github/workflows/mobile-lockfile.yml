name: Mobile lockfile refresh

on:
  push:
    branches:
      - feature/mobile-device-location

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/mobile-device-location
          fetch-depth: 0

      - name: Stop on generated lockfile commit
        id: guard
        run: |
          message="$(git log -1 --pretty=%s)"
          if [ "$message" = "chore(deps): refresh mobile lockfile" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.17.1

      - name: Refresh mobile lockfile only
        if: steps.guard.outputs.skip != 'true'
        working-directory: mobile
        run: pnpm install --lockfile-only

      - name: Commit lockfile when changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet -- mobile/pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/pnpm-lock.yaml
          git commit -m "chore(deps): refresh mobile lockfile"
          git push origin HEAD:feature/mobile-device-location
